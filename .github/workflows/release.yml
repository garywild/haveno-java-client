name: release to Maven Central

# Runs when you publish a GitHub release, e.g. tag v0.1.0.
# Needs these repository secrets (Settings -> Secrets and variables -> Actions):
#   CENTRAL_USERNAME / CENTRAL_PASSWORD  - a user token from https://central.sonatype.com
#   GPG_PRIVATE_KEY / GPG_PASSPHRASE     - the key used to sign the artifacts
# See RELEASING.md.
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: central
          server-username: CENTRAL_USERNAME
          server-password: CENTRAL_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: GPG_PASSPHRASE
      - name: Set version from release tag
        if: github.event_name == 'release'
        run: mvn -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false
      - name: Publish
        run: mvn -B deploy -Prelease
        env:
          CENTRAL_USERNAME: ${{ secrets.CENTRAL_USERNAME }}
          CENTRAL_PASSWORD: ${{ secrets.CENTRAL_PASSWORD }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
